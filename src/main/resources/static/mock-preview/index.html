    <script>
      // 深色默认；跟随 prefers-color-scheme 的 system 模式在首帧前生效，避免闪白
      try {
        var mode = localStorage.getItem('bw-theme') || 'dark'
        var dark =
          mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
